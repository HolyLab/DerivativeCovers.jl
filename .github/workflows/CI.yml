name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The repository holds one package per subdirectory; each is tested on its own.
        package:
          - DerivativeCovers
          - DerivativeCoverProblems
        version:
          - 'min'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        # An `include` entry that changes `os` becomes a job of its own, so each names its package.
        include:
          - package: DerivativeCovers
            version: '1'
            os: macos-latest
            arch: aarch64
          - package: DerivativeCovers
            version: '1'
            os: windows-latest
            arch: x64
          - package: DerivativeCoverProblems
            version: '1'
            os: macos-latest
            arch: aarch64
          - package: DerivativeCoverProblems
            version: '1'
            os: windows-latest
            arch: x64
    defaults:
      run:
        # The `run` steps quote Julia code for a POSIX shell, including on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          # 'min' reads the julia compat bound from this project; there is none at the root.
          project: ${{ matrix.package }}
      - uses: julia-actions/cache@v3
      # Test against this repository's DerivativeCoverProblems rather than the registered one. The
      # source cannot be committed: an installed copy of DerivativeCovers lacks the sibling directory.
      # Julia 1.10 ignores `[sources]`, so the 'min' job uses the registered DerivativeCoverProblems.
      - name: Use the local DerivativeCoverProblems
        if: matrix.package == 'DerivativeCovers'
        run: printf '\n[sources]\nDerivativeCoverProblems = {path = "../DerivativeCoverProblems"}\n' >> DerivativeCovers/Project.toml
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ matrix.package }}/src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # The site documents both packages in this repository, which the docs environment's
      # `[sources]` resolves.
      - name: Instantiate the docs environment
        working-directory: DerivativeCovers
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: DerivativeCovers
      - name: Build and deploy documentation
        working-directory: DerivativeCovers
        run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        working-directory: DerivativeCovers
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using DerivativeCovers
          using DerivativeCoverProblems
          DocMeta.setdocmeta!(DerivativeCovers, :DocTestSetup, :(using DerivativeCovers); recursive=true)
          DocMeta.setdocmeta!(DerivativeCoverProblems, :DocTestSetup, :(using DerivativeCoverProblems); recursive=true)
          doctest(abspath("docs/src"), [DerivativeCovers, DerivativeCoverProblems])
